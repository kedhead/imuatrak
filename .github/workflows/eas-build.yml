name: EAS Build (internal)

# Manually triggered from the Actions tab. Produces a fresh native build
# (e.g. a new internal/TestFlight build) that includes the latest committed
# JavaScript. Use this when a change touches native config, or to ship a build
# that is OTA-update capable. Requires an EXPO_TOKEN repository secret
# (expo.dev → Account Settings → Access Tokens).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, development, production]
        default: preview
      platform:
        description: "Platform to build"
        type: choice
        options: [all, android, ios]
        default: all
      submit:
        description: "Also submit to the stores when the build finishes (production only: TestFlight + Play alpha)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # eas-cli (latest) now requires Node >= 22 via @oclif/plugin-autocomplete.
          # Matches the Node used by eas.json's build profiles.
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Trigger EAS build
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          EXTRA=""
          if [ "$SUBMIT" = "true" ] && [ "$PROFILE" = "production" ]; then EXTRA="--auto-submit"; fi
          eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait $EXTRA

name: App

on:
  pull_request:
    paths-ignore: ["firebase/**", "web/**"]
  push:
    branches: [main]
    paths-ignore: ["firebase/**", "web/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Expo SDK 58 requires Node ^22.13 (`expo` engines).
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Native versions pinned
        # Precompiled iOS frameworks crash at launch if a native package
        # drifts past the installed expo-modules-core. See the script.
        run: npm run check:native
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --ci
